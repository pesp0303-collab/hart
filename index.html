<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجى احبج </title>
  
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 45%, #4a0a26 0%, #230414 55%, #0d0108 100%);
    font-family: 'Aref Ruqaa', serif;
  }

  .stage {
    position: relative;
    width: min(80vw, 480px);
    aspect-ratio: 1 / 1;
    display: flex; align-items: center; justify-content: center;
  }

  /* النبض */
  .heart-wrap {
    position: absolute; inset: 0;
    animation: beat 1.4s infinite ease-in-out;
    transform-origin: 50% 55%;
    filter: drop-shadow(0 0 25px rgba(255, 40, 100, .75)) drop-shadow(0 0 70px rgba(255, 40, 100, .45));
  }
  @keyframes beat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.14); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.09); }
    70%  { transform: scale(1); }
    100% { transform: scale(1); }
  }

  /* لمعان داخل القلب */
  .shine { animation: shine 3s infinite ease-in-out; transform-origin: center; }
  @keyframes shine {
    0%,100% { opacity: .35; }
    50%     { opacity: .75; }
  }

  /* الاسم */
  .name {
    position: relative; z-index: 5;
    font-family: 'Reem Kufi', 'Aref Ruqaa', sans-serif;
    font-size: clamp(3.5rem, 15vw, 7.5rem);
    color: #fff;
    margin-top: -4%;
    text-shadow: 0 0 10px #fff, 0 0 25px #ff9ec0, 0 0 50px #ff3c78, 0 0 80px #ff3c78;
    animation: nameBeat 1.4s infinite ease-in-out, glow 2.8s infinite alternate ease-in-out;
  }
  @keyframes nameBeat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.1); }
    28%  { transform: scale(1); }
    42%  { transform: scale(1.06); }
    70%, 100% { transform: scale(1); }
  }
  @keyframes glow {
    from { filter: brightness(1); }
    to   { filter: brightness(1.25); }
  }

  /* موجات النبض */
  .ring {
    position: absolute; inset: 12%;
    border-radius: 50%;
    border: 2px solid rgba(255, 80, 130, .55);
    animation: ring 2.8s infinite ease-out;
    opacity: 0;
  }
  .ring:nth-child(2) { animation-delay: .9s; }
  .ring:nth-child(3) { animation-delay: 1.8s; }
  @keyframes ring {
    0%   { transform: scale(.6); opacity: .8; }
    100% { transform: scale(2.3); opacity: 0; }
  }

  /* القلوب الطائرة */
  .float-heart {
    position: fixed; bottom: -60px;
    pointer-events: none;
    animation: rise linear forwards;
    z-index: 1;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: .9; }
    50%  { transform: translateY(-55vh) translateX(30px) rotate(15deg); }
    100% { transform: translateY(-115vh) translateX(-30px) rotate(-15deg); opacity: 0; }
  }

  /* نجوم */
  .star {
    position: fixed; width: 3px; height: 3px; border-radius: 50%;
    background: #ffd6e5; animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle { 0%,100% { opacity: .1; } 50% { opacity: 1; } }

  .sub {
    position: absolute; bottom: 6%; left: 0; right: 0; text-align: center;
    color: #ffb3cd; font-size: 1.3rem; letter-spacing: 1px;
    animation: fade 4s infinite ease-in-out;
    z-index: 5;
  }
  @keyframes fade { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
</style>
</head>
<body class="flex items-center justify-center">

  <div id="sky"></div>

  <div class="stage">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="heart-wrap">
      <svg viewBox="0 0 512 512" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="g" cx="35%" cy="30%" r="80%">
            <stop offset="0%" stop-color="#ff6f9f"/>
            <stop offset="45%" stop-color="#e3124f"/>
            <stop offset="100%" stop-color="#8a0530"/>
          </radialGradient>
        </defs>
        <path id="heartPath" fill="url(#g)"
          d="M256 464C238 448 60 330 60 190C60 122 110 76 170 76C208 76 240 96 256 128C272 96 304 76 342 76C402 76 452 122 452 190C452 330 274 448 256 464Z"/>
        <ellipse class="shine" cx="162" cy="146" rx="42" ry="22" transform="rotate(-35 162 146)" fill="#fff"/>
        <circle class="shine" cx="110" cy="196" r="9" fill="#fff"/>
      </svg>
    </div>

    <h1 class="name">رفل</h1>
  </div>

  <p class="sub">♥ نبضٌ لا يتوقف ♥</p>

<script>
  // نجوم
  const sky = document.getElementById('sky');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.transform = `scale(${0.5 + Math.random() * 1.5})`;
    sky.appendChild(s);
  }

  // قلوب صاعدة
  const symbols = ['♥', '❤', '💖', '💗', '💕'];
  const colors = ['#ff4d85', '#ff85ab', '#ff2e63', '#ffb3cd', '#ff6b9a'];
  function spawn() {
    const h = document.createElement('div');
    h.className = 'float-heart';
    h.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 28) + 'px';
    h.style.color = colors[Math.floor(Math.random() * colors.length)];
    const d = 6 + Math.random() * 6;
    h.style.animationDuration = d + 's';
    h.style.textShadow = '0 0 10px currentColor';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), d * 1000);
  }
  setInterval(spawn, 450);
  for (let i = 0; i < 8; i++) setTimeout(spawn, i * 200);

  // عند الضغط: انفجار قلوب
  document.addEventListener('click', e => {
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.textContent = '♥';
      p.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;color:${colors[i % colors.length]};font-size:${14 + Math.random() * 16}px;pointer-events:none;z-index:10;transition:all 1s ease-out;text-shadow:0 0 8px currentColor`;
      document.body.appendChild(p);
      const a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 100;
      requestAnimationFrame(() => {
        p.style.transform = `translate(${Math.cos(a) * r}px, ${Math.sin(a) * r}px) scale(.4)`;
        p.style.opacity = 0;
      });
      setTimeout(() => p.remove(), 1000);
    }
  });
</script>
</body>
</html>
